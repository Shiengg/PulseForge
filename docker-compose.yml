services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-auth

  user-auth:
    build: ./services/user-auth
    env_file:
      - ./services/user-auth/.env
    expose:
      - "4001"
    depends_on:
      - user-auth-db

  user-auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user_auth
      POSTGRES_PASSWORD: user_auth
      POSTGRES_DB: user_auth
    volumes:
      - user_auth_data:/var/lib/postgresql/data
    expose:
      - "5432"

volumes:
  user_auth_data:
