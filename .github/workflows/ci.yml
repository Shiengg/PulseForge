name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List services with a package.json
        id: list
        run: |
          services=$(find services -mindepth 1 -maxdepth 1 -type d -exec test -f "{}/package.json" \; -print \
            | xargs -n1 basename | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Detected services: $services"

  ci:
    needs: detect-services
    if: ${{ needs.detect-services.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: services/${{ matrix.service }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          if jq -e '.scripts.lint' package.json > /dev/null; then
            pnpm run lint
          else
            echo "No lint script, skipping."
          fi

      - name: Test
        run: |
          if jq -e '.scripts.test' package.json > /dev/null; then
            pnpm run test
          else
            echo "No test script, skipping."
          fi

      - name: Syntax check entrypoint
        run: node --check server.js

      - name: Build Docker image
        if: hashFiles(format('services/{0}/Dockerfile', matrix.service)) != ''
        working-directory: .
        run: docker build -t pulseforge/${{ matrix.service }}:ci ./services/${{ matrix.service }}

  notify:
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.ci.result }}
          title: "PulseForge CI"
          nofail: true
